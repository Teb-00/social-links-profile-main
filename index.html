<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Outfit:wght@100..900&display=swap" rel="stylesheet">
  
  <title>Frontend Mentor | Social links profile</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { 
      font-size: 0.6875rem; 
      text-align: center;
      color:hsl(0, 0%, 80%);}
    .attribution a { color: hsl(228, 45%, 44%); }

    body{
      background-color: hsl(0, 0%, 8%);
      font-family: Inter, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container{
      width:327px;
      max-width: 384px;
      background-color: hsl(0, 0%, 12%);
      padding: 30px;
      border-radius: 20px; 
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    main h2{
      font-size: 25px;
      color: hsl(0, 0%, 100%);
      font-weight: 700;
      margin-bottom: 0px;
    }
    main h5{
      font-size: 14px;
      color: hsl(75, 94%, 57%);
      font-weight: 600;
      margin-top: 11px;
      margin-bottom: 0px;
    }
    main h6{
      font-size: 14px;
      color: hsl(0, 0%, 65%);
      font-weight: 600;
      margin-top: 20px;
    }
    main p{
      font-size: 12px;
      font-weight: 600;
      color: hsl(0, 0%, 100%);
      width:280px;
      max-width: 320px;
      height:20px;
      background-color: hsl(0, 0%, 20%);
      padding: 10px;
      border-radius: 5px; 
      text-align: center;
      margin: 9px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }
    main p:hover{
      background-color:hsl(75, 94%, 57%);
      color:hsl(0, 0%, 8%);
      font-weight: 700;
    }
    img{
      border-radius: 50%; 
      margin-bottom: 8px;
       }
      
    
  </style>
</head>
<body>
 <main class="container">
  <img src="./assets/images/avatar-jessica.jpeg" alt="Jessica Randall" width="88px" height="88px">
  <h2>Jessica Randall</h2>
  <h5> London, United Kingdom</h5>
  <h6>"Front-end developer and avid reader."</h6>

  <p>GitHub</p>
  <p>Frontend Mentor</p>
  <p>LinkedIn</p>
  <p>Twitter</p>
  <p>Instagram</p>
 </main> 
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </footer>
</body>
</html>
